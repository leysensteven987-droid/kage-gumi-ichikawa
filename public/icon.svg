<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ichikawa">
  <!-- Kage-gumi app mark: dark-ink rounded square, 市 (market) centered in sakura,
       with a market basket as a faint watermark behind it. Family-matched to
       Raiden + the KG mobile hanko: dark ground, one big serif kanji in the
       operative accent. Maskable-safe: ground inset 16px, marks inside the safe zone. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#2C2530"/>
  <g opacity="0.16" fill="none" stroke="#FF9DB2" stroke-width="22" stroke-linejoin="round" stroke-linecap="round">
    <path d="M196 206 a60 60 0 0 1 120 0"/>
    <path d="M140 206 h232 l-34 168 h-164 z"/>
  </g>
  <text x="256" y="352" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="300" font-weight="700" fill="#FF9DB2">市</text>
</svg>
